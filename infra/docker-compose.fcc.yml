name: trustrfq-fcc

x-tee-common: &tee-common
  build:
    context: ..
    dockerfile: services/fcc-matcher/Dockerfile
  restart: unless-stopped
  networks: [fcc]

services:
  redis-a:
    image: redis:7-alpine
    volumes: [fcc-redis-a:/data]
    networks: [fcc]
  redis-b:
    image: redis:7-alpine
    volumes: [fcc-redis-b:/data]
    networks: [fcc]
  redis-c:
    image: redis:7-alpine
    volumes: [fcc-redis-c:/data]
    networks: [fcc]

  extension-tee-a:
    <<: *tee-common
    environment:
      FCC_MATCHER_PORT: "6674"
      FCC_SERVICE_ROLE: extension-tee
      SIMULATED_TEE: "true"
      LOCAL_MODE: "false"
      FCC_EXTENSION_ID: "${FCC_EXTENSION_ID:-65537}"
      FCC_EXTENSION_VERSION: "${FCC_EXTENSION_VERSION:-1.0.0}"
      FCC_TEE_ID: "tee-a"
      FCC_TEE_PRIVATE_KEY: "${FCC_TEE_A_PRIVATE_KEY:-}"
      FCC_NODE_DECRYPT_TOKEN: "${FCC_TEE_A_DECRYPT_TOKEN:-}"
      FCC_ENCRYPTION_KEY_ID: "${FCC_TEE_A_ENCRYPTION_KEY_ID:-tee-a-key}"
      FCC_REDIS_URL: redis://redis-a:6379
    depends_on: [redis-a]
    healthcheck:
      test: ["CMD", "/fcc-matcher", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  ext-proxy-a:
    <<: *tee-common
    environment:
      FCC_MATCHER_PORT: "6664"
      FCC_SERVICE_ROLE: ext-proxy
      SIMULATED_TEE: "true"
      LOCAL_MODE: "false"
      FCC_EXTENSION_ID: "${FCC_EXTENSION_ID:-65537}"
      FCC_EXTENSION_VERSION: "${FCC_EXTENSION_VERSION:-1.0.0}"
      FCC_TEE_ID: "tee-a"
      FCC_TEE_PRIVATE_KEY: "${FCC_TEE_A_PROXY_PRIVATE_KEY:-}"
      FCC_NODE_DECRYPT_TOKEN: "${FCC_TEE_A_DECRYPT_TOKEN:-}"
      FCC_ENCRYPTION_KEY_ID: "${FCC_TEE_A_PROXY_ENCRYPTION_KEY_ID:-tee-a-proxy-key}"
      FCC_EXTENSION_TEE_URL: http://extension-tee-a:6674
      FCC_INDEXER_MYSQL_HOST: "${FCC_INDEXER_MYSQL_HOST:-34.38.42.208}"
      FCC_INDEXER_MYSQL_PORT: "${FCC_INDEXER_MYSQL_PORT:-3306}"
      FCC_INDEXER_MYSQL_DATABASE: "${FCC_INDEXER_MYSQL_DATABASE:-indexer}"
      FCC_INDEXER_MYSQL_USER: "${FCC_INDEXER_MYSQL_USER:-}"
      FCC_INDEXER_MYSQL_PASSWORD: "${FCC_INDEXER_MYSQL_PASSWORD:-}"
      FCC_REDIS_URL: redis://redis-a:6379
    ports: ["${FCC_TEE_A_HOST_PORT:-8664}:6664"]
    depends_on: [extension-tee-a, redis-a]
    healthcheck:
      test: ["CMD", "/fcc-matcher", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  extension-tee-b:
    <<: *tee-common
    environment:
      FCC_MATCHER_PORT: "6674"
      FCC_SERVICE_ROLE: extension-tee
      SIMULATED_TEE: "true"
      LOCAL_MODE: "false"
      FCC_EXTENSION_ID: "${FCC_EXTENSION_ID:-65537}"
      FCC_EXTENSION_VERSION: "${FCC_EXTENSION_VERSION:-1.0.0}"
      FCC_TEE_ID: "tee-b"
      FCC_TEE_PRIVATE_KEY: "${FCC_TEE_B_PRIVATE_KEY:-}"
      FCC_NODE_DECRYPT_TOKEN: "${FCC_TEE_B_DECRYPT_TOKEN:-}"
      FCC_ENCRYPTION_KEY_ID: "${FCC_TEE_B_ENCRYPTION_KEY_ID:-tee-b-key}"
      FCC_REDIS_URL: redis://redis-b:6379
    depends_on: [redis-b]
    healthcheck:
      test: ["CMD", "/fcc-matcher", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  ext-proxy-b:
