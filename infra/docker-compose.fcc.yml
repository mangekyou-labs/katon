    environment:
      FCC_MATCHER_PORT: "6664"
      FCC_SERVICE_ROLE: ext-proxy
      SIMULATED_TEE: "true"
      LOCAL_MODE: "false"
      FCC_EXTENSION_ID: "${FCC_EXTENSION_ID:-65537}"
      FCC_EXTENSION_VERSION: "${FCC_EXTENSION_VERSION:-1.0.0}"
      FCC_TEE_ID: "tee-b"
      FCC_TEE_PRIVATE_KEY: "${FCC_TEE_B_PROXY_PRIVATE_KEY:-}"
      FCC_NODE_DECRYPT_TOKEN: "${FCC_TEE_B_DECRYPT_TOKEN:-}"
      FCC_ENCRYPTION_KEY_ID: "${FCC_TEE_B_PROXY_ENCRYPTION_KEY_ID:-tee-b-proxy-key}"
      FCC_EXTENSION_TEE_URL: http://extension-tee-b:6674
