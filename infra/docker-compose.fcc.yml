    environment:
      FCC_MATCHER_PORT: "6674"
      FCC_SERVICE_ROLE: extension-tee
      SIMULATED_TEE: "true"
      LOCAL_MODE: "false"
      FCC_EXTENSION_ID: "${FCC_EXTENSION_ID:-65537}"
      FCC_EXTENSION_VERSION: "${FCC_EXTENSION_VERSION:-1.0.0}"
      FCC_TEE_ID: "tee-c"
      FCC_TEE_PRIVATE_KEY: "${FCC_TEE_C_PRIVATE_KEY:-}"
      FCC_NODE_DECRYPT_TOKEN: "${FCC_TEE_C_DECRYPT_TOKEN:-}"
      FCC_ENCRYPTION_KEY_ID: "${FCC_TEE_C_ENCRYPTION_KEY_ID:-tee-c-key}"
      FCC_REDIS_URL: redis://redis-c:6379
    depends_on: [redis-c]
    healthcheck:
      test: ["CMD", "/fcc-matcher", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  ext-proxy-c:
    <<: *tee-common
    environment:
      FCC_MATCHER_PORT: "6664"
      FCC_SERVICE_ROLE: ext-proxy
      SIMULATED_TEE: "true"
      LOCAL_MODE: "false"
      FCC_EXTENSION_ID: "${FCC_EXTENSION_ID:-65537}"
