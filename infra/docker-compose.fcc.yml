      FCC_ENCRYPTION_KEY_ID: "${FCC_TEE_C_PROXY_ENCRYPTION_KEY_ID:-tee-c-proxy-key}"
      FCC_EXTENSION_TEE_URL: http://extension-tee-c:6674
      FCC_INDEXER_MYSQL_HOST: "${FCC_INDEXER_MYSQL_HOST:-34.38.42.208}"
      FCC_INDEXER_MYSQL_PORT: "${FCC_INDEXER_MYSQL_PORT:-3306}"
      FCC_INDEXER_MYSQL_DATABASE: "${FCC_INDEXER_MYSQL_DATABASE:-indexer}"
      FCC_INDEXER_MYSQL_USER: "${FCC_INDEXER_MYSQL_USER:-}"
      FCC_INDEXER_MYSQL_PASSWORD: "${FCC_INDEXER_MYSQL_PASSWORD:-}"
      FCC_REDIS_URL: redis://redis-c:6379
    ports: ["${FCC_TEE_C_HOST_PORT:-8864}:6664"]
