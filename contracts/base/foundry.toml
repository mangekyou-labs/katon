[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = []
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
extra_output = ["storageLayout"]
offline = true

[profile.fork]
offline = false

[fuzz]
runs = 256

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
